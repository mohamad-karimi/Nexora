{% extends "base.html" %}
{% load static %}

{% block content %}
    <main class="main pages">
        <div class="page-header breadcrumb-wrap">
            <div class="container">
                <div class="breadcrumb">
                    <a href="{% url 'website:home' %}" rel="nofollow"><i class="fi-rs-home mr-5"></i>Home</a>
                    <span></span> Vendor <span></span> Dashboard
                </div>
            </div>
        </div>
        <div class="page-content pt-50">
            <div class="container">
                <h1 class="display-2 mt-30 pb-30">Dashboard</h1>
                <hr class="mb-80" />
                <div class="row flex-row-reverse">
                    <div class="col-lg-9">
                        <h3 class="mb-30">Recent Orders</h3>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Order</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Total</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="js-vendor-orders-body">
                                    <tr><td colspan="5">Loading…</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    {% include "dashboard/sidebar.html" %}
                </div>
                <div class="row mb-50 mt-50">
                    <div class="col-lg-12">
                        <h3 class="mb-30">Your Products</h3>
                        <div class="row product-grid js-vendor-products-grid">
                            <div class="col-12"><p class="mb-0">Loading products…</p></div>
                        </div>
                        <!--product grid-->
                        <div class="pagination-area mt-20 mb-20 js-vendor-products-pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
{% block extra_js %}
    <script src="{% static 'js/pages/vendor-dashboard.js' %}"></script>
{% endblock %}
