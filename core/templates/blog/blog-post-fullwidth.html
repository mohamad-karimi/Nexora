{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
    /* Like/Bookmark active-state colors. The icons are inline SVGs
       using fill="currentColor" so `color` here controls them - the
       JS already toggles the "active" class, this just makes it
       visible. Scoped to this page only; nothing else is touched. */
    .js-post-bookmark-btn .icon-svg,
    .js-post-like-btn .icon-svg {
        color: #B6B6B6;
        transition: color 0.2s ease;
    }
    .js-post-like-btn.active .icon-svg {
        color: #FD6E6E;
    }
    .js-post-bookmark-btn.active .icon-svg {
        color: #FDC040;
    }
</style>
{% endblock %}

{% block extra_head %}
<link rel="canonical" href="{{ canonical_url }}" />
{% endblock %}

{% block content %}
    <main class="main">
        <div class="page-content mb-50">
            <div class="container">
                <div class="row" id="js-post-detail" data-post-slug="{{ post_slug }}">
                    <div class="col-lg-9 m-auto">
                        <div class="single-page pt-50 pr-30">
                            <div class="single-header style-2">
                                <div class="row">
                                    <div class="col-xl-10 col-lg-12 m-auto">
                                        <h6 class="mb-10"><a href="#" class="js-post-category">Loading…</a></h6>
                                        <h2 class="mb-10 js-post-title">Loading…</h2>
                                        <div class="single-header-meta">
                                            <div class="entry-meta meta-1 font-xs mt-15 mb-15">
                                                <span class="author-avatar js-post-author-avatar-wrap">
                                                    <img class="img-circle" src="{% static 'imgs/blog/author-1.png' %}" alt="">
                                                </span>
                                                <span class="post-by">By <span class="js-post-author">-</span></span>
                                                <span class="post-on has-dot js-post-date"></span>
                                                <span class="time-reading has-dot js-post-reading-time"></span>
                                            </div>
                                            <div class="social-icons single-share">
                                                <ul class="text-grey-5 d-inline-block">
                                                    <li class="mr-5"><a href="#" class="js-post-bookmark-btn" aria-label="Bookmark this post" title="Bookmark this post"><svg class="icon-svg" width="14" height="16" viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.6869 1.14286V14.8571L7.33398 9.52381L1.98104 14.8571V1.14286H12.6869ZM12.6869 0H1.98104C1.67682 0 1.38506 0.120401 1.16994 0.334728C0.954828 0.549056 0.833984 0.839753 0.833984 1.14286V14.8571C0.83411 15.0831 0.901435 15.3039 1.02747 15.4917C1.15351 15.6795 1.3326 15.8259 1.5421 15.9124C1.68086 15.9712 1.83026 16.001 1.98104 16C2.13183 16.0005 2.28121 15.9711 2.4205 15.9136C2.55979 15.856 2.68621 15.7714 2.7924 15.6648L7.33398 11.0476L11.876 15.6648C11.9821 15.7714 12.1085 15.856 12.2477 15.9135C12.3869 15.9711 12.5362 16.0004 12.6869 16C12.8376 16.001 12.9868 15.9711 13.1255 15.9124C13.335 15.826 13.5142 15.6796 13.6403 15.4918C13.7664 15.304 13.8338 15.0831 13.834 14.8571V1.14286C13.834 0.839753 13.7131 0.549056 13.498 0.334728C13.2829 0.120401 12.9911 0 12.6869 0Z" fill="currentColor"/></svg></a></li>
                                                    <li><a href="#" class="js-post-like-btn" aria-label="Like this post" title="Like this post"><svg class="icon-svg" width="20" height="18" viewBox="0 0 20 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.7535 1.24675C11.645 0.810407 12.4226 0.666686 13.629 0.666701C16.7163 0.679486 19.0013 3.28322 19.0013 6.59992C19.0013 9.13148 17.5898 11.5769 14.9606 13.9416C13.5806 15.1828 11.8185 16.4111 10.5566 17.0646L9.83463 17.4385L9.11264 17.0646C7.85074 16.4111 6.08871 15.1828 4.70867 13.9416C2.07949 11.5769 0.667969 9.13148 0.667969 6.59992C0.667969 3.24774 2.93167 0.666687 6.04676 0.666687C7.20987 0.666687 8.0274 0.824 8.93614 1.27347C9.25253 1.42995 9.5498 1.61557 9.82628 1.82982C10.1138 1.60285 10.4235 1.4083 10.7535 1.24675ZM13.8461 12.7024C16.1564 10.6245 17.3346 8.58327 17.3346 6.59992C17.3346 4.15749 15.7415 2.34213 13.6255 2.33336C12.6571 2.33335 12.1229 2.4321 11.4862 2.74371C11.0946 2.93538 10.7472 3.19415 10.4442 3.52298L9.83658 4.18227L9.22341 3.52816C8.92703 3.212 8.58464 2.95899 8.19725 2.76739C7.54141 2.44301 6.97154 2.33335 6.04676 2.33335C3.90434 2.33335 2.33464 4.12312 2.33464 6.59992C2.33464 8.58327 3.51282 10.6245 5.8232 12.7024C7.08282 13.8353 8.70217 14.9675 9.83463 15.5614C10.9671 14.9675 12.5865 13.8353 13.8461 12.7024Z" fill="currentColor"/></svg> <span class="js-post-like-count">0</span></a></li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <figure class="single-thumbnail">
                                <img class="js-post-image" src="" alt="">
                            </figure>
                            <div class="single-content">
                                <div class="row">
                                    <div class="col-xl-10 col-lg-12 m-auto">
                                        <p class="single-excerpt js-post-excerpt"></p>
                                        <div class="js-post-content"></div>
                                        <!--Entry bottom-->
                                        <div class="entry-bottom mt-50 mb-30 js-post-tags-row" style="display:none">
                                            <div class="tags w-50 w-sm-100 js-post-tags"></div>
                                            <div class="social-icons single-share">
                                                <ul class="text-grey-5 d-inline-block">
                                                    <li><strong class="mr-10">Share this:</strong></li>
                                                    <li class="social-facebook"><a href="#" class="js-share-facebook"><img src="{% static 'imgs/theme/icons/icon-facebook.svg' %}" alt=""></a></li>
                                                    <li class="social-twitter"> <a href="#" class="js-share-twitter"><img src="{% static 'imgs/theme/icons/icon-twitter.svg' %}" alt=""></a></li>
                                                    <li class="social-instagram"><a href="#" class="js-share-copy-link"><img src="{% static 'imgs/theme/icons/icon-instagram.svg' %}" alt=""></a></li>
                                                    <li class="social-linkedin"><a href="#" class="js-share-linkedin"><img src="{% static 'imgs/theme/icons/icon-pinterest.svg' %}" alt=""></a></li>
                                                </ul>
                                            </div>
                                        </div>
                                        <!--Author box-->
                                        <div class="author-bio p-30 mt-50 border-radius-15 bg-white js-post-author-bio" style="display:none">
                                            <div class="author-image mb-30">
                                                <img src="{% static 'imgs/blog/author-1.png' %}" alt="" class="avatar js-post-author-bio-avatar">
                                                <div class="author-infor">
                                                    <h5 class="mb-5 js-post-author-bio-name"></h5>
                                                    <p class="mb-0 text-muted font-xs js-post-author-bio-text"></p>
                                                </div>
                                            </div>
                                        </div>
                                        <!--Comment form-->
                                        <div class="comment-form js-comment-form-wrap">
                                            <h3 class="mb-15 text-center mb-30">Leave a Comment</h3>
                                            <div class="row">
                                                <div class="col-lg-9 col-md-12  m-auto">
                                                    <form class="form-contact comment_form mb-50" id="commentForm">
                                                        <div class="row">
                                                            <div class="col-12">
                                                                <div class="form-group">
                                                                    <textarea class="form-control w-100" name="comment" id="comment" cols="30" rows="9" placeholder="Write Comment"></textarea>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="form-group js-comment-form-message text-danger" style="display:none;"></div>
                                                        <div class="form-group">
                                                            <button type="submit" class="button button-contactForm">Post Comment</button>
                                                        </div>
                                                    </form>
                                                    <p class="js-comment-login-prompt" style="display:none;">
                                                        <a href="{% url 'accounts:login' %}">Log in</a> to leave a comment.
                                                    </p>
                                                    <div class="comments-area">
                                                        <h3 class="mb-30">Comments (<span class="js-comments-count">0</span>)</h3>
                                                        <div class="comment-list m-auto js-comments-list"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock %}
{% block extra_js %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'js/pages/blog-post-detail.js' %}"></script>
{% endblock %}
