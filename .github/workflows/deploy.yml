name: CD

# Deploys only on a direct push to main (i.e. after a PR's CI has
# already passed and been merged). Never runs on pull_request or on
# pushes to any other branch. `stage` never deploys production.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push production image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name/tag
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG="${GITHUB_SHA:0:12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: "Build and push (production image, dockerfile.prod)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    # Requires these repository/environment secrets to actually run:
    #   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PORT (optional, default 22)
    # and a real .env already present at ~/nexora/.env on that server.
    # See docs/production-deployment.md for exactly what's needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy production compose file, Nginx config and scripts to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml,docker/nginx,scripts"
          target: "~/nexora"
          strip_components: 0

      - name: Deploy (pull, migrate, collectstatic, restart, health-check)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE,IMAGE_TAG
          script: |
            set -e
            cd ~/nexora
            chmod +x scripts/*.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export IMAGE="$IMAGE"
            export IMAGE_TAG="$IMAGE_TAG"
            ./scripts/deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE
          script: |
            set -e
            cd ~/nexora
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            export IMAGE="$IMAGE"
            ./scripts/rollback.sh || echo "Automatic rollback could not run -- see docs/production-deployment.md#rollback and roll back manually."
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
