name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Dummy, non-secret values -- only needed so python-decouple/settings.py
# can be imported by manage.py commands run directly in CI (outside
# pytest, which already gets safe defaults from core/conftest.py).
env:
  SECRET_KEY: ci-test-secret-key-not-used-anywhere-else
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  EMAIL_HOST_USER: ci@example.com
  EMAIL_HOST_PASSWORD: ci-test-password

jobs:
  backend:
    name: Backend (migrations, flake8, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: flake8
        run: flake8 .

      - name: Apply migrations (database connectivity check)
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check --database default

      - name: Run tests with coverage
        run: |
          coverage run -m pytest --junitxml=test-report.xml
          coverage xml
          coverage report -m

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: core/coverage.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: core/test-report.xml

  docker:
    name: Docker build & compose healthcheck
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI-only .env for docker compose
        run: |
          cat > .env <<EOF
          DEBUG=False
          SECRET_KEY=$SECRET_KEY
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          EMAIL_HOST_USER=$EMAIL_HOST_USER
          EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD
          SITE_DOMAIN=localhost:8000
          SITE_DISPLAY_NAME=Nexora CI
          EOF

      - name: Build backend image and start the stack
        run: docker compose up -d --build

      - name: Wait for the backend container to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' backend 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy"
              docker compose logs backend
              exit 1
            fi
            sleep 3
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Verify /health/ from the host (database connectivity)
        run: curl --fail --silent --show-error http://localhost:8000/health/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
