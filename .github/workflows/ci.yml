name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Dummy, non-secret values -- only needed so python-decouple/settings.py
# can be imported by manage.py commands run directly in CI (outside
# pytest, which already gets safe defaults from core/conftest.py).
env:
  SECRET_KEY: ci-test-secret-key-not-used-anywhere-else
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1
  EMAIL_HOST_USER: ci@example.com
  EMAIL_HOST_PASSWORD: ci-test-password
  REDIS_PASSWORD: ci-test-redis-password

jobs:
  backend:
    name: Backend (migrations, flake8, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run

      - name: flake8
        run: flake8 .

      - name: Apply migrations (database connectivity check)
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check --database default

      - name: Run tests with coverage
        run: |
          coverage run -m pytest --junitxml=test-report.xml
          coverage xml
          coverage report -m

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: core/coverage.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: core/test-report.xml

  docker:
    name: Docker build & compose healthcheck
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI-only .env for docker compose
        run: |
          cat > .env <<EOF
          DEBUG=False
          SECRET_KEY=$SECRET_KEY
          ALLOWED_HOSTS=$ALLOWED_HOSTS
          EMAIL_HOST_USER=$EMAIL_HOST_USER
          EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD
          REDIS_PASSWORD=$REDIS_PASSWORD
          SITE_DOMAIN=localhost:8000
          SITE_DISPLAY_NAME=Nexora CI
          EOF

      - name: Build backend image and start the stack
        run: docker compose up -d --build

      - name: Wait for the backend container to report healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' backend 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "Container reported unhealthy"
              docker compose logs backend
              exit 1
            fi
            sleep 3
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Apply database migrations inside the backend container
        run: |
          # The compose stack starts on an empty SQLite file, and nothing in
          # docker-compose.yml runs `migrate`. /health/ only opens a DB
          # connection, so it passes on an unmigrated database, but every
          # endpoint that reads a table (e.g. /api/v1/home-slides/) would
          # return 500 and the migration-seeded home slides would not exist.
          # Same command the CD workflow runs after `up -d` in production.
          docker compose exec -T backend python manage.py migrate --noinput

      - name: Verify /health/ from the host (database connectivity)
        run: curl --fail --silent --show-error http://localhost:8000/health/

      - name: Verify /health/redis/ from the host (Redis connectivity)
        run: curl --fail --silent --show-error http://localhost:8000/health/redis/

      - name: Verify the public cache stores data in Redis
        run: |
          # The seeded home slides are public data: two identical reads
          # fill and then use the Redis cache (logical DB 2).
          curl --fail --silent --show-error http://localhost:8000/api/v1/home-slides/ > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/v1/home-slides/ > /dev/null
          keys=$(docker compose exec -T redis sh -c 'if [ -n "$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$REDIS_PASSWORD"; fi; redis-cli -n 2 --scan --pattern "*pubcache*"')
          echo "$keys"
          echo "$keys" | grep -q pubcache

      - name: Wait for the Celery worker to report healthy
        run: |
          # The worker's healthcheck is `celery inspect ping`: healthy means
          # it is running, connected to the Redis broker and answering.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' celery_worker 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "Celery worker did not become healthy in time"
          docker compose logs worker
          exit 1

      - name: Wait for Celery Beat to report healthy
        run: |
          # Beat is the scheduler process (separate from web and worker).
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' celery_beat 2>/dev/null || echo "starting")
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 4
          done
          echo "Celery beat did not become healthy in time"
          docker compose logs beat
          exit 1

      - name: Verify the scheduled tasks are registered with the worker
        run: |
          # Every task named in CELERY_BEAT_SCHEDULE must exist on the worker,
          # otherwise beat would dispatch messages nobody can run.
          docker compose exec -T worker python - <<'PY'
          import os
          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "core.settings")
          django.setup()
          from core.celery import app
          app.loader.import_default_modules()
          missing = [e["task"] for e in app.conf.beat_schedule.values() if e["task"] not in app.tasks]
          assert app.conf.beat_schedule and not missing, missing
          print("scheduled tasks registered:", sorted(e["task"] for e in app.conf.beat_schedule.values()))
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  prod-validate:
    name: Production image & stack validation (Postgres, Nginx, gunicorn)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_ci
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-test-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-prod-validate-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-test-password
      SITE_DOMAIN: localhost
      SITE_DISPLAY_NAME: Nexora CI
      POSTGRES_DB: nexora_ci
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ci-test-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production image (dockerfile.prod)
        run: docker build -f dockerfile.prod -t nexora-backend:prod-ci .

      - name: Validate docker-compose.prod.yml (syntax + variable interpolation)
        run: |
          IMAGE=nexora-backend IMAGE_TAG=prod-ci REDIS_PASSWORD=ci-dummy-redis-password \
            docker compose -f docker-compose.prod.yml config -q

      - name: Run migrations against real PostgreSQL (production image)
        run: |
          docker run --rm --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e CSRF_TRUSTED_ORIGINS \
            -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci python manage.py migrate --noinput

      - name: Sync the Site row (idempotent management command)
        run: |
          docker run --rm --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e CSRF_TRUSTED_ORIGINS \
            -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci python manage.py sync_site

      - name: Collect static files
        run: |
          docker run --rm --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e CSRF_TRUSTED_ORIGINS \
            -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci python manage.py collectstatic --noinput

      - name: Django deployment checklist (manage.py check --deploy)
        run: |
          docker run --rm --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e CSRF_TRUSTED_ORIGINS \
            -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            -e SECURE_SSL_REDIRECT=True -e SESSION_COOKIE_SECURE=True -e CSRF_COOKIE_SECURE=True \
            nexora-backend:prod-ci python manage.py check --deploy --database default

      - name: Start Gunicorn (production image) and verify /health/ + /health/redis/
        run: |
          docker run -d --name backend-ci --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e CSRF_TRUSTED_ORIGINS \
            -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci gunicorn core.wsgi:application -c gunicorn.conf.py
          for i in $(seq 1 20); do
            curl --fail --silent http://localhost:8000/health/ && break
            echo "waiting for gunicorn... ($i)"; sleep 2
          done
          curl --fail --silent --show-error http://localhost:8000/health/
          curl --fail --silent --show-error http://localhost:8000/health/redis/

      - name: Celery worker health (production image)
        run: |
          docker run -d --name worker-ci --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD \
            -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci celery -A core worker --loglevel=INFO --concurrency=2 --hostname=worker-ci@%h
          sleep 8
          docker exec worker-ci celery -A core inspect ping -d worker-ci@$(docker exec worker-ci hostname)

      - name: Celery beat starts and registers the scheduled tasks (production image)
        run: |
          docker run -d --name beat-ci --network host \
            -e SECRET_KEY -e DEBUG -e ALLOWED_HOSTS -e EMAIL_HOST_USER -e EMAIL_HOST_PASSWORD \
            -e SITE_DOMAIN -e SITE_DISPLAY_NAME \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT \
            -e REDIS_HOST -e REDIS_PORT -e REDIS_PASSWORD \
            nexora-backend:prod-ci celery -A core beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
          sleep 5
          docker exec beat-ci grep -q beat /proc/1/cmdline

      - name: Nginx config syntax check (real template, dummy self-signed cert)
        run: |
          # Same shape as scripts/init-letsencrypt.sh's temporary certificate,
          # only used here to validate that Nginx accepts the rendered
          # config -- no real domain/ACME challenge is involved in CI.
          mkdir -p .ci-certs/live/localhost
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout .ci-certs/live/localhost/privkey.pem \
            -out .ci-certs/live/localhost/fullchain.pem \
            -subj /CN=localhost
          docker run --rm \
            -e DOMAIN=localhost \
            -v "$PWD/docker/nginx/templates:/etc/nginx/templates:ro" \
            -v "$PWD/.ci-certs:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs backend-ci || true
          docker logs worker-ci || true
          docker logs beat-ci || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f backend-ci worker-ci beat-ci 2>/dev/null || true
          rm -rf .ci-certs
