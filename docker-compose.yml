services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Celery worker: same image/code as `backend`, but a separate process
  # that runs the background jobs (account emails). The web process only
  # enqueues them in Redis. Source is bind-mounted, so restart this service
  # after changing task code (`docker compose restart worker`).
  worker:
    container_name: celery_worker
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    command: celery -A core worker --loglevel=INFO --concurrency=2 --hostname=worker@%h
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d worker@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: redis
    # Not published to the host: only reachable from other services on
    # the compose network (as redis:6379). Use
    # `docker compose exec redis redis-cli` for a shell.
    # The password comes from .env (REDIS_PASSWORD); empty = no auth.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
